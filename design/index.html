<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-word-5</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .message {
      font-size: clamp(2rem, 8vw, 5rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--text);
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word screen">
    <h1 class="message">Hello Word</h1>
  </main>
</body>
</html>
